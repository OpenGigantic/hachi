<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Tokoboros — Toko the ouroboros mark">
  <title>Tokoboros mark — Toko, the token-ouroboros</title>
  <defs>
    <linearGradient id="toko-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34B27B"/>
      <stop offset="1" stop-color="#1C8A5F"/>
    </linearGradient>
    <radialGradient id="toko-head" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#3EC489"/>
      <stop offset="1" stop-color="#1C8A5F"/>
    </radialGradient>
  </defs>

  <!-- Serpent body: an open circular arc, gap at the top where head meets tail.
       Round caps + a slight taper (thinner near the tail) read as a coiled snake. -->
  <path d="M112.15,31.06 A70,70 0 1 1 87.85,31.06"
        fill="none" stroke="url(#toko-body)" stroke-width="22" stroke-linecap="round"/>
  <!-- Tail taper: a thinner arc laid over the last stretch into the gap -->
  <path d="M87.85,31.06 A70,70 0 0 1 70,40"
        fill="none" stroke="#1C8A5F" stroke-width="13" stroke-linecap="round"/>

  <!-- Head: a fuller rounded form at the right of the gap, biting toward the tail -->
  <circle cx="112" cy="31" r="16" fill="url(#toko-head)"/>

  <!-- Forked tongue flicking across the gap toward the tail (instant "snake" read) -->
  <path d="M101,31 L92,29 M92,29 L87,26 M92,29 L87,32"
        fill="none" stroke="#E8794A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Eye: the persistent brand atom -->
  <circle cx="115" cy="26" r="5" fill="#FDF6EC"/>
  <circle cx="116.5" cy="26" r="2.4" fill="#16261E"/>
  <circle cx="114.6" cy="24.4" r="0.9" fill="#FFFFFF"/>
</svg>
