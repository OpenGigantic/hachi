services:
  hachi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hachi
    ports:
      - "8787:8787"
    restart: unless-stopped
    secrets:
      - gateway_api_token
    environment:
      HACHI_GATEWAY_API_TOKEN_FILE: /run/secrets/gateway_api_token
    volumes:
      - ./.hachi/config:/root/.config/hachi
      - ./.hachi/data:/root/.local/share/hachi
      - ./.hachi/state:/root/.local/state/hachi
      - ./.hachi/cache:/root/.cache/hachi
    command: ["hachi", "gateway", "--host", "0.0.0.0", "--port", "8787", "--runtime"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hachi-frontend
    depends_on:
      - hachi
    secrets:
      - gateway_api_token
    ports:
      - "5173:5173"
    restart: unless-stopped
    environment:
      HACHI_GATEWAY_BASE_URL: http://hachi:8787
      HACHI_GATEWAY_AUTH_HEADER_FILE: /run/secrets/gateway_api_token

secrets:
  gateway_api_token:
    file: ./.hachi/gateway_api_token.txt
