<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" width="640" height="190" role="img" aria-label="Hachi the dog blinking, next to the text CONTRIBUTING.md" xmlns:c2pa="http://c2pa.org/manifest">
  <title>CONTRIBUTING.md — Hachi</title>
  <style>
    .eye {
      fill: #16151A;
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 5s infinite;
    }
    @keyframes blink {
      0%, 94%, 100% { transform: scaleY(1); }
      97% { transform: scaleY(0.1); }
    }
    .title { font: 700 44px ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace; fill: #16151A; }
    .sub   { font: 400 20px ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace; fill: #5C574F; }
    @media (prefers-color-scheme: dark) {
      .title { fill: #F3E9D2; }
      .sub   { fill: #9C968C; }
    }
    @media (prefers-reduced-motion: reduce) { .eye { animation: none; } }
  </style>
