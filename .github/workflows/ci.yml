name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    # Verify the suite passes on Linux, macOS, and Windows so platform-specific
    # regressions (paths, subprocess env, notifier/audio backends, Windows encoding)
    # are caught. windows-latest covers the primary dev platform.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run tests
        # T-71: flipped to -n auto after three consecutive full-suite parallel runs
        # came back green (4640 passed / 21 skipped, 0 failed, each run). Ten
        # wall-clock-duration / cross-thread-timestamp tests were converted to
        # injected clocks / threading.Event / threading.Barrier handoffs so parallel
        # workers no longer starve them (tests/test_test_suite_hygiene.py locks this
        # down). test_loop_backstop_cancel.py still asserts a real production
        # deadline (5x margin) and is the one deliberate holdout -- see its
        # KNOWN_WALL_CLOCK entry. If this step starts flaking on a specific
        # platform, re-pin `-n 0` here AND in scripts/preflight.py AND
        # pyproject.toml's addopts comment together, and re-open T-71 rather than
        # adding retries/flaky-markers.
        run: uv run pytest -q -n auto

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync --extra dev --extra security

      - name: Run security audit
        run: uv run python -m hachi.cli.main security-audit --json --fail-on-high
        continue-on-error: true

      - name: Strict security audit (fail on medium)
        run: uv run python -m hachi.cli.main security-audit --json --fail-on-high --fail-on-medium
        if: github.event_name == 'pull_request'

      # ---------------------------------------------------------------------------
      # Dependency CVE scan (E11/T11.4 / G-A5)
      # Policy: on PRs this is a hard gate — no new high-severity CVEs may land.
      # On push to main it is advisory (continue-on-error) because upstream CVEs
      # in transitive deps can appear at any time and are outside our control; the
      # finding is still surfaced in the job log for triage.
      # Known CVEs that are under active remediation (bump PRs open) may be
      # suppressed here with --ignore-vuln <ID> with a written justification
      # comment.  Do not add ignores without a tracking issue.
      # Current outstanding CVEs (2026-06-19): see job summary below.
      #   aiohttp <3.14.0  — transitive via chromadb/uvicorn; bump tracked in
      #                      https://github.com/OpenGigantic/hachi/issues/TBD
      #   starlette <1.3.1 — transitive via fastapi; upgrade fastapi to lift starlette
      #   cryptography <48.0.1 — GHSA-537c-gmf6-5ccf; bump to >=48.0.1 in pyproject
      # ---------------------------------------------------------------------------
      - name: Dependency CVE scan — pip-audit (advisory on main)
        run: uv run pip-audit --skip-editable
        continue-on-error: ${{ github.event_name != 'pull_request' }}

      # ---------------------------------------------------------------------------
      # SAST — bandit (E11/T11.4)
      # -ll means medium+ severity only. Low-severity findings are noisy and not
      # actionable at this stage; revisit when the medium backlog reaches zero.
      # Findings in src/ with existing # noqa: BXXX / # nosec suppressions are
      # respected. Do NOT add bulk suppressions — fix or accept each individually.
      # ---------------------------------------------------------------------------
      - name: SAST — bandit (medium+ severity)
        run: uv run bandit -r src -ll --exit-zero
        # Advisory: 22 medium findings, 0 high (verified 2026-07-26). Ratchet to
        # blocking (drop --exit-zero) once the medium count hits zero.

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync --extra dev

      # Hard gate on every push and PR. Baseline is clean; mirrored by scripts/preflight.py.
      - name: Lint (ruff)
        run: uv run ruff check src tests

      # T1.3: mypy on the full src tree is still non-blocking on main because there
      # are 483 pre-existing errors across 64 files (chromadb typing issues in
      # memory_vault.py, og_engine/engine.py annotation gaps, community_packs.py).
      # These are pre-existing debt, not introduced by any single change, and are
      # tracked as a ratchet rather than fixed here — see T-69-mypy-burndown-ratchet.md
      # and docs/bug-bank.md BB-143. Making this blocking today would turn main red
      # immediately for unrelated debt.
      # Strategy: the scoped strict gate (mypy-strict-gate.ini) IS blocking on PRs
      # and covers 48 files that are already clean.  The full-tree check here is
      # advisory on both main and PRs — it records the error count trend over time.
      # Full burn-down is tracked as a Phase 3 sustained effort (T-69).
      - name: Type check — full tree (advisory)
        run: uv run mypy src --ignore-missing-imports
        continue-on-error: true

      # T1.3: Scoped strict gate — blocks on PRs, advisory on main.
      # Covers 48 core/og_engine/gateway files that are already type-clean.
      # Any PR that introduces a new error in these files will fail CI.
      - name: Type check — strict gate on clean files (blocking on PRs)
        run: uv run python -m mypy --config-file mypy-strict-gate.ini
        if: github.event_name == 'pull_request'

      # -----------------------------------------------------------------------
      # Guardrails Phase 2 — the Rails. Mirrors scripts/preflight.py.
      # ban-lint is a HARD gate (CF-17 / T-67): mechanically enforces the bans recorded
      # in CLAUDE.md "Out of scope" (e.g. no TOKOBOROS_* compat shims) instead of
      # leaving them as prose only — baseline is zero the moment the banned pattern is
      # deleted, so it blocks from day one. import-linter is a HARD gate: the
      # architectural layering is green, so a new cross-layer import (e.g. the domain
      # importing the gateway) fails CI here. deptry/vulture/complexity are advisory
      # (continue-on-error) until their baselines reach zero — see pyproject
      # [tool.importlinter]/[tool.deptry]/[tool.vulture]/[tool.ruff.lint.pylint].
      # -----------------------------------------------------------------------
      - name: Guardrails — ban-lint (reintroduced compat shims, blocking)
        run: uv run python scripts/check_bans.py

      - name: Architecture — import-linter (blocking)
        run: uv run lint-imports

      - name: Dependencies — deptry (advisory)
        run: uv run deptry src
        continue-on-error: true

      - name: Dead code — vulture (advisory)
        run: uv run vulture
        continue-on-error: true

      - name: Complexity — PLR outliers (advisory)
        run: uv run ruff check src --select PLR0911,PLR0912,PLR0913,PLR0915 --statistics
        continue-on-error: true

      # Guardrails Phase 3 — keep the ADRs well-formed and indexed. Advisory (baseline clean).
      - name: ADR docs — adr-lint (advisory)
        run: uv run python scripts/check_adrs.py
        continue-on-error: true

  skill-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Lint shipped .og skill files
        run: uv run python scripts/lint_skills.py

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: ObjectGraph benchmark (token-savings + M1 retrieval)
        run: uv run hachi skill benchmark --suite fast --json --threshold 0.80

  eval:
    # Regression gate for the agent loop (P4 Eval). Replays the curated eval
    # corpus (DEFAULT_REPLAY_SUITE) through the REAL ExecutionLoop driven by a
    # scripted LLM — deterministic, no API key needed — and FAILS if any case
    # regresses. `hachi eval run` exits non-zero on any case failure, so this
    # job blocks merges that break the loop's control-flow contracts.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run eval regression suite
        run: uv run hachi eval run

  frontend-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync Python dependencies
        run: uv sync --extra dev

      - name: Install frontend dependencies
        run: npm install --prefix frontend

      - name: Export OpenAPI schema
        run: uv run hachi gateway-openapi --output openapi/hachi-openapi.json

      - name: Verify generated API artifacts are current
        run: npm run --prefix frontend check:api

      - name: Frontend typecheck
        run: npm run --prefix frontend typecheck

  docker-smoke:
    # Real verification of the Docker self-host recipe (AUDIT P0-4): the compose file must
    # be valid and BOTH images must build — the previous string-only test stayed green over
    # a missing frontend/Dockerfile and unwritable /root volumes. ubuntu-latest ships Docker
    # + compose v2.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provide a dummy gateway token secret
        run: |
          mkdir -p .hachi
          echo "ci-smoke-token" > .hachi/gateway_api_token.txt

      - name: Validate compose config
        run: docker compose config

      - name: Build images (backend + frontend)
        run: docker compose build
