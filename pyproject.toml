[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "tokoboros"
version = "0.1.0"
description = "Tokoboros - The Autonomous Agent Engine powered by ObjectGraph (.og)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Tokoboros Project" }
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "pydantic>=2.9.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "anthropic>=0.40.0",
    "httpx>=0.28.0",
    "chromadb>=0.5.5",
    "platformdirs>=4.3.0",
    "keyring>=25.5.0",
    "cryptography>=43.0.0",
    "tomlkit>=0.13.2",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "textual>=0.75.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
]
google = [
    "google-auth>=2.35.0",
    "google-api-python-client>=2.154.0",
]
notion = [
    "notion-client>=2.2.1",
]
slack = [
    "slack-sdk>=3.33.3",
]
memory = [
    "chromadb>=0.5.5",
]
local-models = [
    "httpx>=0.28.0",
]
browser = [
    "playwright>=1.48.0",
]
tracing = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
]
presentations = [
    "python-pptx>=1.0.0",
]

[project.scripts]
tokoboros = "tokoboros.cli.main:app"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"] # flake8, isort, warnings, bugbear, pyupgrade
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/tokoboros"]
