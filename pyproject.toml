[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "hachi-og"
version = "0.1.0"
description = "Hachi - The Autonomous Agent Engine powered by ObjectGraph (.og)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Open Gigantic" }
]
keywords = [
    "ai",
    "agent",
    "llm",
    "anthropic",
    "objectgraph",
    "autonomous-agent",
    "telegram-bot",
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "pydantic>=2.9.0",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.48.0",
    "anthropic>=0.105.2",
    "httpx>=0.28.0",
    "chromadb>=1.5.9",
    "platformdirs>=4.3.0",
    "keyring>=25.5.0",
    "cryptography>=48.0.0",
    "tomlkit>=0.13.2",
    "typer>=0.26.4",
    "rich>=13.7.0",
    "textual>=0.75.0",
    "Pillow>=10.3.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.15",
    "mypy>=1.11.0",
]
google = [
    "google-auth>=2.53.0",
    "google-api-python-client>=2.154.0",
]
notion = [
    "notion-client>=2.2.1",
]
slack = [
    "slack-sdk>=3.33.3",
]
memory = [
    "chromadb>=1.5.9",
]
local-models = [
    "httpx>=0.28.0",
]
browser = [
    "playwright>=1.48.0",
]
tracing = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
]
presentations = [
    "python-pptx>=1.0.0",
]
# Opt-in for providers that use reverse-engineered web APIs (potential ToS risk).
# Install with: pip install hachi-og[unofficial]
# Then set HACHI_UNOFFICIAL=1 to actually enable the provider.
unofficial = []
# Security-scanning tools — used by CI (security job) and local audits.
# Install with: uv sync --extra security
security = [
    "pip-audit>=2.7.0",
    "bandit[toml]>=1.7.0",
]

[project.urls]
Homepage = "https://github.com/OpenGigantic/hachi"
Repository = "https://github.com/OpenGigantic/hachi"
Issues = "https://github.com/OpenGigantic/hachi/issues"

[project.scripts]
hachi = "hachi.cli.main:app"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"] # flake8, isort, warnings, bugbear, pyupgrade
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.hatch.build.targets.wheel]
packages = ["src/hachi"]
